[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youbu-annotation"
version = "0.1.0"
description = "Offline desktop tools for gait sensor annotation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.26",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "scipy>=1.12",
]

[project.optional-dependencies]
test = ["Pillow>=10", "pytest>=8"]

[project.scripts]
youbu-annotation = "youbu_annotation.editor:main"
youbu-auto-annotate = "youbu_annotation.auto_annotate:cli"
youbu-annotation-aid = "youbu_annotation.annotation_aid:cli"
youbu-visualize = "youbu_annotation.visualize_leg_positions:main"

[tool.setuptools]
packages = ["youbu_annotation"]
package-dir = {youbu_annotation = "."}
include-package-data = true

[tool.setuptools.package-data]
youbu_annotation = [
  "CONTEXT.md",
  "DEPLOYMENT.md",
  "README.md",
  "requirements.txt",
  "*.sh",
]
